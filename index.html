<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>商品情報・接客メモ検索システム</title>
  <!-- バーコード読み取りライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode/html5-qrcode.min.js"></script>
  <!-- Markdown変換ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      background-color: #f0f2f5;
      color: #333333;
      line-height: 1.5;
      font-size: 14px;
      padding-bottom: 40px;
    }

    /* ヘッダー */
    .header {
      background-color: #2c3e50;
      color: #ffffff;
      padding: 12px 16px;
      border-bottom: 1px solid #1a252f;
    }
    .header-inner {
      max-width: 640px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-title {
      font-size: 16px;
      font-weight: bold;
    }
    .header-buttons {
      display: flex;
      gap: 8px;
    }
    .btn-header {
      background-color: #34495e;
      color: #ffffff;
      border: 1px solid #4a6278;
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-header:hover {
      background-color: #415b76;
    }

    /* コンテナ */
    .container {
      max-width: 640px;
      margin: 16px auto;
      padding: 0 12px;
    }

    /* パネル共通 */
    .panel {
      background-color: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .panel-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid #eeeeee;
      color: #2c3e50;
    }

    /* ログイン画面 */
    #loginScreen {
      max-width: 380px;
      margin: 60px auto;
    }
    .error-text {
      color: #c0392b;
      font-size: 12px;
      margin-top: 6px;
      display: none;
    }

    /* アラート・ステータス表示枠 */
    .status-box {
      padding: 10px 12px;
      border-radius: 3px;
      font-size: 12px;
      margin-bottom: 14px;
      line-height: 1.5;
      word-break: break-all;
    }
    .status-error {
      background-color: #fdf2f2;
      border: 1px solid #f5c6cb;
      color: #a94442;
    }
    .status-success {
      background-color: #f0f9eb;
      border: 1px solid #c2e7b0;
      color: #3c763d;
    }

    /* フォーム要素 */
    .form-group {
      margin-bottom: 14px;
    }
    .form-label {
      display: block;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 6px;
      color: #333333;
    }
    .form-note {
      font-size: 11px;
      color: #666666;
      font-weight: normal;
      margin-left: 4px;
    }
    .input-row {
      display: flex;
      gap: 6px;
    }
    .input-text, .select-box {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #bbbbbb;
      border-radius: 3px;
      font-size: 14px;
      width: 100%;
      background-color: #ffffff;
    }
    .input-text:focus, .select-box:focus {
      outline: none;
      border-color: #2980b9;
    }

    /* ボタン */
    .btn {
      padding: 8px 12px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 3px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-secondary {
      background-color: #f8f9fa;
      color: #333333;
      border-color: #bbbbbb;
    }
    .btn-secondary:hover {
      background-color: #e2e6ea;
    }
    .btn-dark {
      background-color: #444444;
      color: #ffffff;
    }
    .btn-dark:hover {
      background-color: #333333;
    }
    .btn-primary {
      background-color: #1f618d;
      color: #ffffff;
      width: 100%;
      padding: 11px;
      font-size: 14px;
    }
    .btn-primary:hover {
      background-color: #1a5276;
    }
    .btn-primary:disabled {
      background-color: #95a5a6;
      cursor: not-allowed;
    }

    /* モード切替タブ */
    .tabs {
      display: flex;
      border-bottom: 2px solid #2c3e50;
      margin-bottom: 16px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background-color: #e0e4e8;
      color: #555555;
      border: 1px solid #cccccc;
      border-bottom: none;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
    .tab-btn.active {
      background-color: #2c3e50;
      color: #ffffff;
      border-color: #2c3e50;
    }

    /* 商品プレビュー枠 */
    .product-preview {
      margin-top: 8px;
      padding: 10px;
      background-color: #f9fafb;
      border: 1px solid #dddddd;
      border-radius: 3px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .product-img-box {
      width: 72px;
      height: 72px;
      background-color: #ffffff;
      border: 1px solid #cccccc;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      font-size: 11px;
      color: #888888;
      text-align: center;
    }
    .product-img-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .product-info {
      flex: 1;
      min-width: 0;
    }
    .product-maker {
      font-size: 11px;
      color: #666666;
    }
    .product-model {
      font-size: 14px;
      font-weight: bold;
      color: #1f618d;
      word-break: break-all;
    }
    .product-name {
      font-size: 12px;
      color: #333333;
      margin-top: 2px;
    }
    .product-links {
      margin-top: 4px;
      font-size: 11px;
    }
    .product-links a {
      color: #2980b9;
      text-decoration: underline;
      margin-right: 10px;
    }

    /* スキャナー */
    .scanner-box {
      background-color: #000000;
      border: 1px solid #333333;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .scanner-header {
      background-color: #222222;
      color: #ffffff;
      padding: 8px 12px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-close-scanner {
      background-color: #c0392b;
      color: #ffffff;
      border: none;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 2px;
      cursor: pointer;
    }

    /* ローディング */
    .loading-box {
      text-align: center;
      padding: 24px;
      color: #555555;
      font-size: 13px;
    }
    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 3px solid #cccccc;
      border-top-color: #2c3e50;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 結果出力用Markdownスタイル */
    .result-body h2 {
      font-size: 15px;
      font-weight: bold;
      color: #2c3e50;
      background-color: #f0f4f8;
      padding: 6px 10px;
      border-left: 4px solid #2c3e50;
      margin: 16px 0 8px 0;
    }
    .result-body h2:first-child {
      margin-top: 0;
    }
    .result-body h3 {
      font-size: 14px;
      font-weight: bold;
      margin: 12px 0 4px 0;
      color: #333333;
    }
    .result-body ul, .result-body ol {
      padding-left: 20px;
      margin-bottom: 10px;
    }
    .result-body li {
      margin-bottom: 4px;
    }
    .result-body p {
      margin-bottom: 8px;
    }
    .result-body strong {
      font-weight: bold;
      color: #000000;
      background-color: #fff9db;
      padding: 0 2px;
    }
    .result-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0;
      font-size: 13px;
    }
    .result-body th, .result-body td {
      border: 1px solid #cccccc;
      padding: 6px 8px;
      text-align: left;
    }
    .result-body th {
      background-color: #f4f5f7;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header class="header">
    <div class="header-inner">
      <div class="header-title">商品情報・接客メモ検索</div>
      <div id="headerControls" class="header-buttons hidden">
        <button type="button" class="btn-header" onclick="toggleConfigPanel()">API設定</button>
        <button type="button" class="btn-header" onclick="logout()">ログアウト</button>
      </div>
    </div>
  </header>

  <!-- ログイン画面 -->
  <div id="loginScreen" class="container">
    <div class="panel">
      <div class="panel-title">スタッフ認証</div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="passwordInput">パスワードを入力してください</label>
          <input type="password" id="passwordInput" class="input-text" placeholder="パスワード" required>
          <div id="loginError" class="error-text">パスワードが正しくありません。</div>
        </div>
        <button type="submit" class="btn btn-primary">ログイン</button>
      </form>
    </div>
  </div>

  <!-- メイン画面 -->
  <main id="mainApp" class="container hidden">

    <!-- エラー・ステータスメッセージ表示枠 -->
    <div id="globalStatusBox" class="status-box hidden"></div>

    <!-- 設定パネル -->
    <div id="configPanel" class="panel hidden">
      <div class="panel-title">システム設定（ブラウザ保存）</div>
      
      <div class="form-group">
        <label class="form-label">Gemini APIキー <span class="form-note">※必須（Google AI Studioで取得）</span></label>
        <input type="text" id="apiKeyInput" class="input-text" placeholder="AIzaSy...">
      </div>

      <div class="form-group">
        <label class="form-label">AIモデル選択</label>
        <select id="modelSelect" class="select-box">
          <option value="gemini-2.5-flash">gemini-2.5-flash（推奨・高速）</option>
          <option value="gemini-2.5-pro">gemini-2.5-pro（高精度）</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">楽天アプリID (Application ID) <span class="form-note">※任意（設定するとJANから商品画像を高確率で表示）</span></label>
        <input type="text" id="rakutenIdInput" class="input-text" placeholder="例: 1029384756...">
      </div>

      <div style="display: flex; gap: 8px;">
        <button type="button" class="btn btn-dark" onclick="saveConfig()">設定を保存</button>
        <button type="button" class="btn btn-secondary" onclick="testApiConnection()">API接続テストを実行</button>
      </div>
      <div id="configTestResult" class="status-box hidden" style="margin-top: 10px; margin-bottom: 0;"></div>
    </div>

    <!-- モード切替タブ -->
    <div class="tabs">
      <button type="button" id="tabSingle" class="tab-btn active" onclick="switchMode('single')">単体商品の確認</button>
      <button type="button" id="tabCompare" class="tab-btn" onclick="switchMode('compare')">2商品の比較</button>
    </div>

    <!-- カメラ読み取りエリア -->
    <div id="scannerContainer" class="scanner-box hidden">
      <div class="scanner-header">
        <span id="scannerTargetLabel">バーコードを枠内に合わせてください</span>
        <button type="button" class="btn-close-scanner" onclick="stopScanner()">閉じる</button>
      </div>
      <div id="reader" style="width: 100%;"></div>
    </div>

    <!-- 入力フォーム -->
    <div class="panel">
      <!-- 商品A -->
      <div class="form-group">
        <label id="labelProductA" class="form-label">対象商品（JANコード または 型番・商品名）</label>
        <div class="input-row">
          <input type="text" id="inputProductA" class="input-text" placeholder="JANコード または 型番">
          <button type="button" class="btn btn-dark" onclick="startScanner('A')">カメラ読取</button>
          <button type="button" class="btn btn-secondary" onclick="lookupProductOnly('A')">商品確認</button>
        </div>
        <!-- 商品A プレビュー枠 -->
        <div id="previewA" class="product-preview hidden">
          <div class="product-img-box" id="imgBoxA">画像なし</div>
          <div class="product-info">
            <div class="product-maker" id="makerA">-</div>
            <div class="product-model" id="modelA">-</div>
            <div class="product-name" id="nameA">-</div>
            <div class="product-links" id="linksA"></div>
          </div>
        </div>
      </div>

      <!-- 商品B（比較モード時のみ） -->
      <div id="productBContainer" class="form-group hidden" style="border-top: 1px solid #eeeeee; padding-top: 14px;">
        <label class="form-label">比較対象：商品B（JANコード または 型番・商品名）</label>
        <div class="input-row">
          <input type="text" id="inputProductB" class="input-text" placeholder="JANコード または 型番">
          <button type="button" class="btn btn-dark" onclick="startScanner('B')">カメラ読取</button>
          <button type="button" class="btn btn-secondary" onclick="lookupProductOnly('B')">商品確認</button>
        </div>
        <!-- 商品B プレビュー枠 -->
        <div id="previewB" class="product-preview hidden">
          <div class="product-img-box" id="imgBoxB">画像なし</div>
          <div class="product-info">
            <div class="product-maker" id="makerB">-</div>
            <div class="product-model" id="modelB">-</div>
            <div class="product-name" id="nameB">-</div>
            <div class="product-links" id="linksB"></div>
          </div>
        </div>
      </div>

      <!-- 要望メモ -->
      <div class="form-group" style="border-top: 1px solid #eeeeee; padding-top: 14px;">
        <label class="form-label">接客メモ・お客様の要望 <span class="form-note">（任意）</span></label>
        <input type="text" id="customerNote" class="input-text" placeholder="例：予算重視、手入れが楽なもの、一人暮らし用 など">
      </div>

      <button type="button" id="submitBtn" class="btn btn-primary" onclick="runConsulting()">接客・比較データを出力する</button>
    </div>

    <!-- ローディング -->
    <div id="loadingIndicator" class="panel loading-box hidden">
      <div class="spinner"></div>
      <div id="loadingText">商品情報を照会しています...</div>
    </div>

    <!-- 出力結果 -->
    <div id="resultContainer" class="panel hidden">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eeeeee; padding-bottom: 8px; margin-bottom: 12px;">
        <span style="font-weight: bold; font-size: 13px; color: #2c3e50;">出力結果</span>
        <button type="button" class="btn btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="clearAll()">クリア</button>
      </div>
      <div id="resultContent" class="result-body"></div>
    </div>

  </main>

  <script>
    // ==========================================
    // パスワード設定（任意の文字列に変更可能）
    // ==========================================
    const SYSTEM_PASSWORD = "1234";

    let currentMode = 'single';
    let html5QrCode = null;
    const rakutenCache = { A: null, B: null };

    // 初期化処理
    window.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('staff_logged_in') === 'true') {
        showMainApp();
      }

      const savedApiKey = localStorage.getItem('gemini_api_key') || '';
      const savedRakutenId = localStorage.getItem('rakuten_app_id') || '';
      let savedModel = localStorage.getItem('gemini_model') || 'gemini-2.5-flash';

      // 【重要修正】古い廃止モデル(1.5や2.0)が保存されていた場合は強制的に2.5へリセット
      if (!savedModel.startsWith('gemini-2.5')) {
        savedModel = 'gemini-2.5-flash';
        localStorage.setItem('gemini_model', savedModel);
      }

      document.getElementById('apiKeyInput').value = savedApiKey;
      document.getElementById('rakutenIdInput').value = savedRakutenId;
      document.getElementById('modelSelect').value = savedModel;

      if (!savedApiKey) {
        document.getElementById('configPanel').classList.remove('hidden');
      }
    });

    // 不要な空白・改行・全角文字を除去する関数
    function sanitizeKey(str) {
      return (str || '').replace(/[^\x21-\x7E]/g, '');
    }

    // AIの返答から太字(**)や全角コロン(：)を無視して値を正確に抽出する関数
    function extractField(text, key, fallback = '') {
      const regex = new RegExp(`(?:^|\\n)[\\s\\*\\-]*${key}[\\s\\*]*[:：]\\s*(.+)`, 'i');
      const match = text.match(regex);
      if (!match) return fallback;
      return match[1].replace(/\*\*/g, '').trim() || fallback;
    }

    function showGlobalStatus(message, isError = true) {
      const box = document.getElementById('globalStatusBox');
      box.className = 'status-box ' + (isError ? 'status-error' : 'status-success');
      box.innerHTML = message;
      box.classList.remove('hidden');
    }

    function hideGlobalStatus() {
      document.getElementById('globalStatusBox').classList.add('hidden');
    }

    function handleLogin(event) {
      event.preventDefault();
      const input = document.getElementById('passwordInput').value;
      if (input === SYSTEM_PASSWORD) {
        sessionStorage.setItem('staff_logged_in', 'true');
        document.getElementById('loginError').style.display = 'none';
        document.getElementById('passwordInput').value = '';
        showMainApp();
      } else {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function showMainApp() {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      document.getElementById('headerControls').classList.remove('hidden');
    }

    function logout() {
      sessionStorage.removeItem('staff_logged_in');
      stopScanner();
      document.getElementById('mainApp').classList.add('hidden');
      document.getElementById('headerControls').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    }

    function toggleConfigPanel() {
      document.getElementById('configPanel').classList.toggle('hidden');
      document.getElementById('configTestResult').classList.add('hidden');
    }

    function saveConfig() {
      const apiKey = sanitizeKey(document.getElementById('apiKeyInput').value);
      const rakutenId = sanitizeKey(document.getElementById('rakutenIdInput').value);
      const model = document.getElementById('modelSelect').value;

      document.getElementById('apiKeyInput').value = apiKey;
      document.getElementById('rakutenIdInput').value = rakutenId;

      localStorage.setItem('gemini_api_key', apiKey);
      localStorage.setItem('rakuten_app_id', rakutenId);
      localStorage.setItem('gemini_model', model);

      document.getElementById('configPanel').classList.add('hidden');
      hideGlobalStatus();
      alert('設定を保存しました。');
    }

    // ====================================================
    // Gemini API 呼び出し関数（Google検索対応＋自動フォールバック）
    // ====================================================
    async function callGeminiAPI(promptText, useSearch = true) {
      const rawKey = document.getElementById('apiKeyInput').value || localStorage.getItem('gemini_api_key');
      const apiKey = sanitizeKey(rawKey);
      if (!apiKey) {
        throw new Error('APIキーが設定されていません。右上の「API設定」から入力して保存してください。');
      }

      let selectedModel = localStorage.getItem('gemini_model') || 'gemini-2.5-flash';
      if (!selectedModel.startsWith('gemini-2.5')) {
        selectedModel = 'gemini-2.5-flash';
      }

      const modelsToTry = [selectedModel, 'gemini-2.5-flash', 'gemini-2.5-pro']
        .filter((v, i, a) => a.indexOf(v) === i);

      let lastDetailedError = '';

      for (const model of modelsToTry) {
        // 検索ありを優先し、万が一ツール権限エラーが出た場合は検索なしで再試行
        const searchModes = useSearch ? [true, false] : [false];

        for (const enableSearch of searchModes) {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
          const payload = {
            contents: [{ parts: [{ text: promptText }] }]
          };

          if (enableSearch) {
            payload.tools = [{ google_search: {} }];
          }

          try {
            const response = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            // まずテキストとして安全に取得してからJSONパースする
            const rawResponseText = await response.text();
            let data = {};
            try {
              data = JSON.parse(rawResponseText);
            } catch (parseErr) {
              lastDetailedError = `[HTTP ${response.status}] 応答の解析に失敗しました。`;
              continue;
            }

            if (!response.ok || data.error) {
              const errObj = data.error || {};
              const code = errObj.code || response.status;
              const msg = errObj.message || '不明なAPIエラー';
              lastDetailedError = `[HTTP ${code}] ${msg} (モデル: ${model})`;

              if (msg.includes('API_KEY_INVALID') || msg.includes('API key not valid')) {
                throw new Error(`APIキーが無効です。Google AI Studioで正しいキーをコピーしているか確認してください。<br>詳細: ${msg}`);
              }
              if (code === 403 && msg.includes('referer')) {
                throw new Error(`APIキーの「ウェブサイト制限（HTTPリファラー制限）」により通信が拒否されました。Google AI Studio / Cloud Consoleでキーの制限を解除してください。<br>詳細: ${msg}`);
              }
              continue;
            }

            const parts = data.candidates?.[0]?.content?.parts || [];
            const fullText = parts.map(p => p.text || '').join('');

            if (fullText.trim()) {
              return { text: fullText, model: model, searchUsed: enableSearch };
            } else {
              lastDetailedError = `AIからのテキスト応答が空でした。(モデル: ${model})`;
            }

          } catch (fetchErr) {
            if (fetchErr.message.includes('APIキーが無効') || fetchErr.message.includes('ウェブサイト制限')) {
              throw fetchErr;
            }
            lastDetailedError = `通信エラー: ${fetchErr.message}`;
          }
        }
      }

      throw new Error(`API通信に失敗しました。<br>${lastDetailedError}`);
    }

    // API接続テスト機能
    async function testApiConnection() {
      const resultBox = document.getElementById('configTestResult');
      const apiKey = sanitizeKey(document.getElementById('apiKeyInput').value);
      const model = document.getElementById('modelSelect').value;

      if (!apiKey) {
        resultBox.className = 'status-box status-error';
        resultBox.textContent = 'APIキーを入力してください。';
        resultBox.classList.remove('hidden');
        return;
      }

      document.getElementById('apiKeyInput').value = apiKey;
      localStorage.setItem('gemini_api_key', apiKey);
      localStorage.setItem('gemini_model', model);

      resultBox.className = 'status-box';
      resultBox.style.backgroundColor = '#f8f9fa';
      resultBox.style.border = '1px solid #cccccc';
      resultBox.style.color = '#333333';
      resultBox.textContent = `接続テスト中... (${model})`;
      resultBox.classList.remove('hidden');

      try {
        const res = await callGeminiAPI('「接続テストOK」とだけ返答してください。', false);
        resultBox.className = 'status-box status-success';
        resultBox.innerHTML = `<strong>接続成功！</strong><br>使用モデル: ${res.model}<br>応答: ${res.text.trim()}`;
      } catch (err) {
        resultBox.className = 'status-box status-error';
        resultBox.innerHTML = `<strong>接続失敗:</strong><br>${err.message}`;
      }
    }

    // モード切替
    function switchMode(mode) {
      currentMode = mode;
      const tabSingle = document.getElementById('tabSingle');
      const tabCompare = document.getElementById('tabCompare');
      const productBContainer = document.getElementById('productBContainer');
      const labelProductA = document.getElementById('labelProductA');

      if (mode === 'single') {
        tabSingle.classList.add('active');
        tabCompare.classList.remove('active');
        productBContainer.classList.add('hidden');
        labelProductA.textContent = '対象商品（JANコード または 型番・商品名）';
      } else {
        tabCompare.classList.add('active');
        tabSingle.classList.remove('active');
        productBContainer.classList.remove('hidden');
        labelProductA.textContent = '商品A（JANコード または 型番・商品名）';
      }
    }

    // カメラバーコード読み取り
    async function startScanner(targetSlot) {
      const scannerContainer = document.getElementById('scannerContainer');
      const targetLabel = document.getElementById('scannerTargetLabel');
      scannerContainer.classList.remove('hidden');
      targetLabel.textContent = `商品${targetSlot}のバーコードを読み取り中...`;

      if (html5QrCode) {
        await stopScanner();
        scannerContainer.classList.remove('hidden');
      }

      html5QrCode = new Html5Qrcode("reader");
      const config = {
        fps: 10,
        qrbox: { width: 240, height: 110 },
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A
        ]
      };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          (decodedText) => {
            document.getElementById(`inputProduct${targetSlot}`).value = decodedText;
            stopScanner();
            lookupProductOnly(targetSlot);
          },
          () => {}
        );
      } catch (err) {
        showGlobalStatus("カメラの起動に失敗しました。カメラ権限が許可されているか、またはHTTPS（もしくはlocalhost）環境で開いているか確認してください。", true);
        scannerContainer.classList.add('hidden');
      }
    }

    async function stopScanner() {
      if (html5QrCode && html5QrCode.isScanning) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {
          console.error(e);
        }
      }
      document.getElementById('scannerContainer').classList.add('hidden');
    }

    // 楽天APIから商品画像と商品名を取得する補助関数
    async function fetchRakutenItem(query) {
      const rakutenId = sanitizeKey(localStorage.getItem('rakuten_app_id'));
      if (!rakutenId) return null;

      try {
        const rUrl = `https://app.rakuten.co.jp/services/api/IchibaItem/Search/20220601?applicationId=${encodeURIComponent(rakutenId)}&keyword=${encodeURIComponent(query)}&hits=1`;
        const rRes = await fetch(rUrl);
        if (rRes.ok) {
          const rData = await rRes.json();
          if (rData.Items && rData.Items.length > 0) {
            const item = rData.Items[0].Item;
            let imageUrl = '';
            if (item.mediumImageUrls && item.mediumImageUrls.length > 0) {
              const firstImg = item.mediumImageUrls[0];
              const rawImgUrl = typeof firstImg === 'string' ? firstImg : (firstImg.imageUrl || '');
              imageUrl = rawImgUrl.replace('?_ex=128x128', '?_ex=200x200');
            }
            return {
              title: item.itemName || '',
              imageUrl: imageUrl
            };
          }
        }
      } catch (e) {
        console.warn('楽天APIスキップ:', e);
      }
      return null;
    }

    // 商品プレビュー枠の更新
    function updatePreviewUI(slot, maker, model, name, imageUrl, rawQuery) {
      const previewEl = document.getElementById(`preview${slot}`);
      const imgBoxEl = document.getElementById(`imgBox${slot}`);
      const makerEl = document.getElementById(`maker${slot}`);
      const modelEl = document.getElementById(`model${slot}`);
      const nameEl = document.getElementById(`name${slot}`);
      const linksEl = document.getElementById(`links${slot}`);

      previewEl.classList.remove('hidden');
      makerEl.textContent = maker || '-';
      modelEl.textContent = `型番: ${model || rawQuery}`;
      nameEl.textContent = name || '-';

      if (imageUrl && imageUrl.startsWith('http')) {
        imgBoxEl.innerHTML = `<img src="${imageUrl}" alt="商品画像" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML='画像なし'">`;
      } else {
        imgBoxEl.innerHTML = '画像なし';
      }

      const searchKeyword = encodeURIComponent(`${maker || ''} ${model || rawQuery}`.trim());
      linksEl.innerHTML = `<a href="https://www.google.com/search?tbm=isch&q=${searchKeyword}" target="_blank" rel="noopener">Google画像検索で写真を見る</a>`;
    }

    // 「商品確認」単体ボタンの処理
    async function lookupProductOnly(slot) {
      hideGlobalStatus();
      const query = document.getElementById(`inputProduct${slot}`).value.trim();
      if (!query) {
        alert('JANコードまたは型番を入力してください。');
        return;
      }

      const previewEl = document.getElementById(`preview${slot}`);
      previewEl.classList.remove('hidden');
      document.getElementById(`imgBox${slot}`).innerHTML = '読込中...';
      document.getElementById(`maker${slot}`).textContent = '検索中...';
      document.getElementById(`model${slot}`).textContent = query;
      document.getElementById(`name${slot}`).textContent = 'Google検索で特定中...';

      try {
        const rItem = await fetchRakutenItem(query);
        rakutenCache[slot] = rItem;

        const prompt = `
商品識別情報「${query}」${rItem?.title ? `（参考商品名: ${rItem.title}）` : ''} について、Google検索を用いて正確なメーカー名、型番、商品名、およびWeb上の商品画像URL（分かる場合のみ）を特定し、以下の4行のフォーマットのみで出力してください。

MAKER: メーカー名
MODEL: 正確な型番
NAME: 商品名
IMAGE: httpsから始まる画像URL（不明な場合は空欄）
`;
        const res = await callGeminiAPI(prompt, true);
        const text = res.text;

        const maker = extractField(text, 'MAKER', '不明');
        const model = extractField(text, 'MODEL', query);
        const name = extractField(text, 'NAME', rItem?.title || '特定できませんでした');
        const aiImgMatch = text.match(/IMAGE[:：]\s*(https?:\/\/[^\s\*\)]+)/i);
        const aiImg = aiImgMatch ? aiImgMatch[1].trim() : '';

        updatePreviewUI(slot, maker, model, name, rItem?.imageUrl || aiImg, query);

      } catch (err) {
        document.getElementById(`maker${slot}`).textContent = 'エラー';
        document.getElementById(`name${slot}`).textContent = '上の赤枠のエラー内容を確認してください';
        document.getElementById(`imgBox${slot}`).innerHTML = 'エラー';
        showGlobalStatus(err.message, true);
      }
    }

    // メインの接客・比較データ生成処理
    async function runConsulting() {
      hideGlobalStatus();
      const inputA = document.getElementById('inputProductA').value.trim();
      const inputB = document.getElementById('inputProductB').value.trim();
      const note = document.getElementById('customerNote').value.trim();

      if (!inputA) {
        alert('対象商品のJANコードまたは型番を入力してください。');
        return;
      }
      if (currentMode === 'compare' && !inputB) {
        alert('比較対象（商品B）のJANコードまたは型番を入力してください。');
        return;
      }

      document.getElementById('loadingIndicator').classList.remove('hidden');
      document.getElementById('resultContainer').classList.add('hidden');
      document.getElementById('submitBtn').disabled = true;

      try {
        document.getElementById('loadingText').textContent = 'Google検索で商品情報を特定し、接客データを生成しています...';

        const rItemA = rakutenCache.A || await fetchRakutenItem(inputA);
        let rItemB = null;
        if (currentMode === 'compare') {
          rItemB = rakutenCache.B || await fetchRakutenItem(inputB);
        }

        let prompt = "";
        if (currentMode === 'single') {
          prompt = `
店舗スタッフ向けの業務資料として、Google検索を用いて以下の商品を正確に特定し、接客ポイントをまとめてください。絵文字は使用しないでください。

【対象商品】: ${inputA} ${rItemA?.title ? `（参考商品名: ${rItemA.title}）` : ''}
${note ? `【お客様の要望メモ】: ${note}` : ''}

最初に必ず以下の4行で商品の特定情報を出力し、その後に「===REPORT===」という区切り文字を入れてから、Markdown形式の接客資料を出力してください。

MAKER_A: メーカー名
MODEL_A: 正確な型番
NAME_A: 商品名
IMAGE_A: httpsから始まる商品画像URL（不明な場合は空欄）
===REPORT===
## 1. 基本情報
- メーカー / 商品名 / 型番
- 商品の特徴要約（1行）

## 2. 主なセールスポイント（3点）
- カタログスペックだけでなく、実際の使用シーンでのメリット（ベネフィット）を箇条書きで3点記載してください。

## 3. 接客・提案のポイント
- **ヒアリング項目**: 最初に確認すべき質問
- **提案トーク例**: おすすめする際の具体的な説明フレーズ
- **注意点・補足**: 事前に伝えるべきデメリットや、関連商品・上位モデルの提案ヒント
`;
        } else {
          prompt = `
店舗スタッフ向けの業務資料として、Google検索を用いて以下の2商品を正確に特定し、比較シートを作成してください。絵文字は使用しないでください。

【商品A】: ${inputA} ${rItemA?.title ? `（参考商品名: ${rItemA.title}）` : ''}
【商品B】: ${inputB} ${rItemB?.title ? `（参考商品名: ${rItemB.title}）` : ''}
${note ? `【お客様の要望メモ】: ${note}` : ''}

最初に必ず以下の8行で2商品の特定情報を出力し、その後に「===REPORT===」という区切り文字を入れてから、Markdown形式の比較資料を出力してください。

MAKER_A: 商品Aのメーカー名
MODEL_A: 商品Aの正確な型番
NAME_A: 商品Aの商品名
IMAGE_A: 商品Aの画像URL（不明な場合は空欄）
MAKER_B: 商品Bのメーカー名
MODEL_B: 商品Bの正確な型番
NAME_B: 商品Bの商品名
IMAGE_B: 商品Bの画像URL（不明な場合は空欄）
===REPORT===
## 1. 比較対象
- **商品A**: メーカー / 商品名 / 型番
- **商品B**: メーカー / 商品名 / 型番

## 2. スペック・特徴比較表
Markdownの表形式で、主要な違い（機能・サイズ・使い勝手・想定ターゲットなど）を3〜5項目で比較してください。

## 3. 主な相違点（3点以内）
2機種の決定的な違いを簡潔に箇条書きしてください。

## 4. 推奨ターゲットの切り分け
- **商品Aが向いているお客様**: 用途・重視ポイントと提案フレーズ
- **商品Bが向いているお客様**: 用途・重視ポイントと提案フレーズ
- **選定の決め手**: 迷われているお客様への確認質問
`;
        }

        const res = await callGeminiAPI(prompt, true);
        const fullText = res.text;

        const splitParts = fullText.split('===REPORT===');
        const metaPart = splitParts.length > 1 ? splitParts[0] : fullText;
        const reportPart = splitParts.length > 1 ? splitParts[1].trim() : fullText;

        const makerA = extractField(metaPart, 'MAKER_A', '-');
        const modelA = extractField(metaPart, 'MODEL_A', inputA);
        const nameA = extractField(metaPart, 'NAME_A', rItemA?.title || '-');
        const imgAMatch = metaPart.match(/IMAGE_A[:：]\s*(https?:\/\/[^\s\*\)]+)/i);
        const imgA = rItemA?.imageUrl || (imgAMatch ? imgAMatch[1].trim() : '');
        updatePreviewUI('A', makerA, modelA, nameA, imgA, inputA);

        if (currentMode === 'compare') {
          const makerB = extractField(metaPart, 'MAKER_B', '-');
          const modelB = extractField(metaPart, 'MODEL_B', inputB);
          const nameB = extractField(metaPart, 'NAME_B', rItemB?.title || '-');
          const imgBMatch = metaPart.match(/IMAGE_B[:：]\s*(https?:\/\/[^\s\*\)]+)/i);
          const imgB = rItemB?.imageUrl || (imgBMatch ? imgBMatch[1].trim() : '');
          updatePreviewUI('B', makerB, modelB, nameB, imgB, inputB);
        }

        document.getElementById('resultContent').innerHTML = marked.parse(reportPart);
        document.getElementById('resultContainer').classList.remove('hidden');

      } catch (err) {
        showGlobalStatus(err.message, true);
      } finally {
        document.getElementById('loadingIndicator').classList.add('hidden');
        document.getElementById('submitBtn').disabled = false;
      }
    }

    function clearAll() {
      hideGlobalStatus();
      document.getElementById('inputProductA').value = '';
      document.getElementById('inputProductB').value = '';
      document.getElementById('customerNote').value = '';
      document.getElementById('previewA').classList.add('hidden');
      document.getElementById('previewB').classList.add('hidden');
      document.getElementById('resultContainer').classList.add('hidden');
      rakutenCache.A = null;
      rakutenCache.B = null;
    }
  </script>
